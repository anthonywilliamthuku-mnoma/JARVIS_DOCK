<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LEON</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="island" id="island">
      <header class="pill" id="pill" title="Click to open LEON">
        <span class="dot" id="dot" aria-hidden="true"></span>
        <span class="wordmark">LEON</span>
        <span class="state" id="state">ready</span>
        <span class="spacer"></span>
        <span class="model" id="model">connecting…</span>
        <button class="ghost" id="toggle" aria-label="Open or close">⌄</button>
      </header>

      <section class="panel" id="panel">
        <div class="thread" id="thread" aria-live="polite">
          <article class="intro" id="intro">
            <h1>Hello, I am LEON.</h1>
            <p>
              I run on this PC, on your own model. Ask me the time, the date,
              your location or how the machine is doing — those come from
              Windows, not from me guessing.
            </p>
          </article>
        </div>

        <div class="approval" id="approval" hidden>
          <p class="why" id="askWhy"></p>
          <pre class="detail" id="askDetail"></pre>
          <div class="row">
            <button class="deny" id="deny" type="button">Deny</button>
            <button class="allow" id="allow" type="button">Allow</button>
          </div>
        </div>

        <footer class="foot">
          <div class="stats" id="stats">ready</div>
          <form class="composer" id="composer" autocomplete="off">
            <textarea
              id="input"
              rows="1"
              placeholder="Ask LEON…"
              spellcheck="false"
              aria-label="Message LEON"
            ></textarea>
            <button class="send" id="send" type="submit" title="Send" aria-label="Send">↑</button>
            <button class="stop" id="stop" type="button" title="Stop (Esc)" aria-label="Stop" hidden>
              ■
            </button>
          </form>
        </footer>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
