[project]
name = "leon"
version = "0.1.0"
description = "LEON: a local-first PC agent with a compact dock UI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyaudiowpatch>=0.2.12.9; sys_platform == 'win32'",
    "pycaw>=20260927; sys_platform == 'win32'",
    "pywebview>=6.2.1",
    "segno>=1.6.6",
    "winrt-windows-foundation>=4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-windows-graphics-imaging>=4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-windows-media-control>=4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-windows-media-ocr>=4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-windows-storage>=4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=4!10.0.28000.2957; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leond"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["leond", "tests"]

[[tool.mypy.overrides]]
module = [
    "comtypes",
    "comtypes.*",
    "pyaudiowpatch",
    "pycaw",
    "pycaw.*",
    "segno",
    "sounddevice",
    "webview",
    "webview.*",
    "winsdk",
    "winsdk.*",
    "winrt",
    "winrt.*",
]
ignore_missing_imports = true

[project.scripts]
leon = "leond.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
